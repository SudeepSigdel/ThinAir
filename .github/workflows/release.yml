# Publishes ready-made server images to GitHub's container registry, so installing Thinair is a
# download instead of a build on a small VM:
#   ghcr.io/sudeepsigdel/thinair:<version>, :<major>.<minor>, :latest   on a tag like v0.2.0
#   ghcr.io/sudeepsigdel/thinair:edge                                   on every push to main
# For x86 (amd64) and ARM (arm64) servers. The image includes the optional Postgres driver.
name: Release image
on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write   # push to ghcr.io with the workflow's own token (no personal token needed)
  id-token: write   # keyless signing of the image (cosign), with this workflow's own identity

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # A red commit or tag must not publish an image: `edge` and `latest` are what installs pull.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --extra dev
      - run: uv run ruff check .
      - run: uv run pytest -m "not docker"

  image:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v5
      # The exact dependency versions CI tested (uv.lock), so the image is not whatever pip finds
      # newest on the day of the build. The Dockerfile uses this file when it is there.
      - run: uv export --frozen --no-hashes --no-dev --extra postgres --no-emit-project > constraints.txt
      - uses: docker/setup-qemu-action@v4    # emulates arm64 on the amd64 runner
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          # metadata-action lowercases this (registry names must be lowercase).
          images: ghcr.io/${{ github.repository_owner }}/thinair
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=edge,branch=main
      - id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          build-args: EXTRAS=postgres
          # Build attestations: what went into the image, and where it was built.
          provenance: mode=max
          sbom: true
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # Anyone can check that an image came from this repository's workflow:
      #   cosign verify ghcr.io/<owner>/thinair:<tag>
      #     --certificate-identity-regexp 'https://github.com/<owner>/ThinAir/'
      #     --certificate-oidc-issuer https://token.actions.githubusercontent.com
      - uses: sigstore/cosign-installer@v4.1.3
      - name: Sign the image
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/thinair@${DIGEST}"
