# Publishes ready-made server images to GitHub's container registry, so installing Thinair is a
# download instead of a build on a small VM:
#   ghcr.io/sudeepsigdel/thinair:<version>, :<major>.<minor>, :latest   on a tag like v0.2.0
#   ghcr.io/sudeepsigdel/thinair:edge                                   on every push to main
# For x86 (amd64) and ARM (arm64) servers. The image includes the optional Postgres driver.
name: Release image
on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write   # push to ghcr.io with the workflow's own token (no personal token needed)

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4    # emulates arm64 on the amd64 runner
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          # metadata-action lowercases this (registry names must be lowercase).
          images: ghcr.io/${{ github.repository_owner }}/thinair
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=edge,branch=main
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          build-args: EXTRAS=postgres
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
