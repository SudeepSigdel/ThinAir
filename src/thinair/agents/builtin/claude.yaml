# Claude Code (https://code.claude.com/docs). Flags verified against the official docs on
# 2026-11-05; see docs/agents.md for what was checked.
id: claude
name: Claude Code
version: "2.1.311"
install: npm install -g @anthropic-ai/claude-code@2.1.311
needs_node: true          # the npm package needs Node.js 22+
output: stream-json
command:
  - claude
  - -p
  - "{task}"
  - --output-format
  - stream-json
  - --verbose
  # Headless runs otherwise start in "manual" mode and deny every action that needs approval.
  # Safe here only because the container is the sandbox (non-root, no host access); the CLI
  # refuses this mode as root.
  - --permission-mode
  - bypassPermissions
  - --max-turns
  - "80"
env:
  CLAUDE_CONFIG_DIR: /thinair-auth          # the per-agent login volume is mounted here
  DISABLE_AUTOUPDATER: "1"
  CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC: "1"
auth:
  config_dir: /thinair-auth
  login_command: [claude]                   # interactive: type /login, follow the link, then /exit
  check_command: [claude, auth, status]     # exits 0 when logged in, 1 when not
  # Optional alternative to logging in: generate a token on your own machine with
  # `claude setup-token` and set CLAUDE_CODE_OAUTH_TOKEN in Thinair's environment.
  env_passthrough: [CLAUDE_CODE_OAUTH_TOKEN, ANTHROPIC_API_KEY]
  login_help: >-
    In Claude Code, type /login, open the link it shows (any device works), sign in with your
    own account, paste the code back, then type /exit.
  hint: >-
    Claude Code is not signed in for this Thinair server. Sign it in on the Agents screen of the
    Thinair app, or run `thinair auth claude` on the server.
  # Sign-in from the phone. Checked in a terminal with 2.1.311 (docs/agents.md "In-app login"):
  # `claude auth login` prints "If the browser didn't open, visit: <link>" (PKCE: the link has
  # code_challenge, S256) and then "Paste code here if prompted > ". The code is exchanged at
  # platform.claude.com, already on the egress allowlist; claude.com is only opened on the phone.
  login_flow:
    command: [claude, auth, login]
    url: 'visit:\s*(https://\S+)'
    url_hosts: [claude.com, claude.ai, platform.claude.com]
    code_in: 'Paste code here'
    help: Sign in with your own Claude account, then copy the code it shows.
# Outbound allowlist (Claude Code honours HTTPS_PROXY; hosts from its network-config docs):
# the API, and claude.ai / platform.claude.com for subscription login and token refresh.
# Telemetry hosts are off anyway (CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC).
egress:
  - api.anthropic.com
  - claude.ai
  - platform.claude.com
auth_error_patterns:
  - authentication_failed
  - not logged in
  - invalid api key
  - please run /login
limits:
  cpus: 2
  memory: 2g
  pids: 1024
  timeout_s: 1800
